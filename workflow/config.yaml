# Parâmetros congelados das campanhas. Alterar só com registro no diário.
campaign_seed: 51193

experiments:
  E1:
    spec: workflow/experiments/E1.json
    pilot_n: 3
    # N da campanha confirmatória: DECISÃO HUMANA após o piloto
    # (ver scripts/dimensionar_n.py e docs/METODOLOGIA.md §3.5). null = não rodar.
    n: 3   # por boot (provisório; 2 boots = 6 por célula)
  E2:
    spec: workflow/experiments/E2.json
    pilot_n: 5
    n: 5   # um boot (provisório)

  E3:
    spec: workflow/experiments/E3.json
    pilot_n: 5
    n: 5   # por boot (provisório; 2 boots = 10 por célula)

  E3b:
    spec: workflow/experiments/E3b.json
    pilot_n: 5
    n: 5   # um boot (provisório)
  E1fast:
    spec: workflow/experiments/E1fast.json
    pilot_n: 1
    n: 1   # equivalência (provisório)

  E4:
    spec: workflow/experiments/E4.json
    pilot_n: 3
    n: 5   # um boot (provisório)

  E5:
    spec: workflow/experiments/E5.json
    pilot_n: 2
    # N por Clopper-Pearson: com 0 erros, limite superior unilateral 95% da taxa de
    # erro por conexão <= 1% exige >= 299 conexões por célula; a menor célula (K=2)
    # tem 50 conexões por rodada -> 6 rodadas (3 por boot, 2 boots). Ver METODOLOGIA §3.5.
    n: 3   # por boot

  E6:
    spec: workflow/experiments/E6.json
    pilot_n: 2
    # mesmo critério do E5 (Clopper-Pearson, >= 299 decisões por célula; K=2 tem 50/rodada)
    n: 3   # por boot

  E7:
    spec: workflow/experiments/E7.json
    pilot_n: 2
    n: 13   # por boot (2 boots): 12 decisões por rodada -> 26 rodadas = 312 >= 299 (Clopper-Pearson, ver METODOLOGIA §3.3)

  E2b:
    spec: workflow/experiments/E2b.json
    pilot_n: 2
    n: 5   # por boot (2 boots); piloto: captura = 1 ate P=4 e variavel (0,33-0,58) em P=8; P=6 adicionado para localizar o limite

  # injeção de falhas no framework (E5f/E6f/E6n/E7f): só piloto até a decisão do Eder
  E5f:
    spec: workflow/experiments/E5f.json
    pilot_n: 1
    n: 4   # por boot (2 boots): K=2 tem 40-48 conexões sem rótulo errado por rodada -> 8 rodadas >= 299 (Clopper-Pearson)
  E6f:
    spec: workflow/experiments/E6f.json
    pilot_n: 1
    n: 4   # por boot (2 boots): mesmo critério do E5f, sobre decisões
  E6n:
    spec: workflow/experiments/E6n.json
    pilot_n: 1
    n: null   # substituído pelo E6L (modo 0)
  E7f:
    spec: workflow/experiments/E7f.json
    pilot_n: 2
    n: 13   # por boot (2 boots): 12 decisões por rodada -> 26 rodadas = 312 >= 299, como no E7

  E6L:
    spec: workflow/experiments/E6L.json
    pilot_n: 1
    n: 2   # por boot (2 boots): 200 decisões por rodada -> 4 rodadas = 800 por célula
  E6Ls:
    spec: workflow/experiments/E6Ls.json
    pilot_n: 1
    n: 3   # por boot (2 boots): K=2 tem 50 decisões por rodada -> 6 rodadas = 300

  # experimentos adicionais (18/10/2026): placa de rede real e mais modelos no E7.
  # N confirmatório decidido após o piloto (mesmos critérios dos experimentos de origem).
  E5net:
    spec: workflow/experiments/E5net.json
    pilot_n: 1
    n: 3   # por boot (2 boots), como o E5: K=2 tem 50 conexões por rodada -> 6 rodadas >= 299
  E6net:
    spec: workflow/experiments/E6net.json
    pilot_n: 1
    n: 3   # por boot (2 boots), como o E6
  E3net:
    spec: workflow/experiments/E3net.json
    pilot_n: 3
    n: 5   # por boot (provisório; dimensionar pelo piloto)
  E7m:
    spec: workflow/experiments/E7m.json
    pilot_n: 1
    n: 13   # por boot (2 boots): K=4 tem 12 decisões por rodada -> 26 rodadas = 312 >= 299, como no E7

# precisão relativa alvo (meia-largura do IC95% / média) para dimensionar N
precision_target: 0.05


