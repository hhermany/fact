# Frozen campaign parameters. Change only with a record in the methodology log.
campaign_seed: 51193

experiments:
  E1:
    spec: workflow/experiments/E1.json
    pilot_n: 3
    # N of the confirmatory campaign: a HUMAN DECISION after the pilot
    # (see scripts/size_n.py and docs/METHODOLOGY.md §3.5). null = do not run.
    n: 3   # per boot (2 boots = 6 per cell)
  E2:
    spec: workflow/experiments/E2.json
    pilot_n: 5
    n: 5   # one boot

  E3:
    spec: workflow/experiments/E3.json
    pilot_n: 5
    n: 5   # per boot (2 boots = 10 per cell)

  E3b:
    spec: workflow/experiments/E3b.json
    pilot_n: 5
    n: 5   # one boot
  E3send:
    spec: workflow/experiments/E3send.json
    pilot_n: 2
    n: 5   # per boot (2 boots = 10 per cell)
  E1fast:
    spec: workflow/experiments/E1fast.json
    pilot_n: 1
    n: 1   # equivalence check

  E4:
    spec: workflow/experiments/E4.json
    pilot_n: 3
    n: 5   # one boot

  E5:
    spec: workflow/experiments/E5.json
    pilot_n: 2
    # N by Clopper-Pearson: with 0 errors, a one-sided 95% upper bound on the
    # per-connection error rate <= 1% requires >= 299 connections per cell; the smallest
    # cell (K=2) has 50 connections per run -> 6 runs (3 per boot, 2 boots). See METHODOLOGY §3.5.
    n: 3   # per boot

  E6:
    spec: workflow/experiments/E6.json
    pilot_n: 2
    # same criterion as E5 (Clopper-Pearson, >= 299 decisions per cell; K=2 has 50 per run)
    n: 3   # per boot

  E7:
    spec: workflow/experiments/E7.json
    pilot_n: 2
    n: 13   # per boot (2 boots): 12 decisions per run -> 26 runs = 312 >= 299 (Clopper-Pearson, see METHODOLOGY §3.3)

  E2b:
    spec: workflow/experiments/E2b.json
    pilot_n: 2
    n: 5   # per boot (2 boots); pilot: capture = 1 up to P=4 and variable (0.33-0.58) at P=8; P=6 added to locate the limit

  # fault injection into the framework (E5f/E6f/E6n/E7f)
  E5f:
    spec: workflow/experiments/E5f.json
    pilot_n: 1
    n: 4   # per boot (2 boots): K=2 has 40-48 correctly labeled connections per run -> 8 runs >= 299 (Clopper-Pearson)
  E6f:
    spec: workflow/experiments/E6f.json
    pilot_n: 1
    n: 4   # per boot (2 boots): same criterion as E5f, on decisions
  E6n:
    spec: workflow/experiments/E6n.json
    pilot_n: 1
    n: null   # replaced by E6L (mode 0)
  E7f:
    spec: workflow/experiments/E7f.json
    pilot_n: 2
    n: 13   # per boot (2 boots): 12 decisions per run -> 26 runs = 312 >= 299, as in E7

  E6L:
    spec: workflow/experiments/E6L.json
    pilot_n: 1
    n: 2   # per boot (2 boots): 200 decisions per run -> 4 runs = 800 per cell
  E6Ls:
    spec: workflow/experiments/E6Ls.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=2 has 50 decisions per run -> 6 runs = 300

  # additional experiments: real network interface and more models in E7.
  # Confirmatory N decided after the pilot (same criteria as the original experiments).
  E5net:
    spec: workflow/experiments/E5net.json
    pilot_n: 1
    n: 3   # per boot (2 boots), as E5: K=2 has 50 connections per run -> 6 runs >= 299
  E6net:
    spec: workflow/experiments/E6net.json
    pilot_n: 1
    n: 3   # per boot (2 boots), as E6
  E3net:
    spec: workflow/experiments/E3net.json
    pilot_n: 3
    n: 5   # per boot (2 boots), as E3 (sized from the E3 pilot); obtained 95% CI 1.9-3.6% < 5%
  E7m:
    spec: workflow/experiments/E7m.json
    pilot_n: 1
    n: 13   # per boot (2 boots): K=4 has 12 decisions per run -> 26 runs = 312 >= 299, as in E7

  # the same agents with commercial models via API (Anthropic); same N criterion as E7m
  E7c:
    spec: workflow/experiments/E7c.json
    pilot_n: 1
    n: 13   # per boot (2 boots): K=4 has 12 decisions per run -> 26 runs = 312 >= 299, as in E7m

  # the same with OpenAI models (Responses API); same N criterion as E7c
  E7o:
    spec: workflow/experiments/E7o.json
    pilot_n: 1
    n: 13   # per boot (2 boots): K=4 has 12 decisions per run -> 26 runs = 312 >= 299, as in E7c

  # model-free replay of the recorded E7c and E7o runs (no API, no cost)
  E7r:
    spec: workflow/experiments/E7r.json
    pilot_n: 1
    n: 13   # per boot (2 boots): repeats each of the 208 recorded runs once per boot; criterion: outcome identical to the recording

  # related system actually run next to FACT (same criterion as E5)
  E5ap:
    spec: workflow/experiments/E5ap.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=2 has 50 connections per run -> 300 >= 299; 95% CI of AgentProvenance's error rate <= 5.7 points

  # AgentProvenance in the setting it targets (own process tree and cgroup per execution)
  E5aps:
    spec: workflow/experiments/E5aps.json
    pilot_n: 1
    n: 3   # per boot (2 boots), as E5ap: same cells, server-side windows
  E5partial:
    spec: workflow/experiments/E5partial.json
    pilot_n: 1
    n: 5   # per boot (2 boots)
  E10budget:
    spec: workflow/experiments/E10budget.json
    pilot_n: 1
    n: 3   # per boot (2 boots)
  E10conc:
    spec: workflow/experiments/E10conc.json
    pilot_n: 1
    n: 3   # per boot (2 boots)
  E9cost:
    spec: workflow/experiments/E9cost.json
    pilot_n: 1
    n: 5   # per boot (2 boots = 10 per cell)
  E1ap:
    spec: workflow/experiments/E1ap.json
    pilot_n: 1
    n: 3   # per boot (2 boots): 4 executions x 50 operations = 200 connections per run -> 1200 per cell

  # third-party client libraries and the official MCP fetch server's code, unmodified (same criterion as E5)
  E5lib:
    spec: workflow/experiments/E5lib.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 100 connections per run -> 600 >= 299 per cell

  # second runtime (Node.js MCP server, fact_rt_node); same criterion as E5lib
  E5node:
    spec: workflow/experiments/E5node.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 100 connections per run -> 600 >= 299 per cell

  # CPU cost under the E7r agent workload (one replay of each recording per boot)
  E7rc:
    spec: workflow/experiments/E7rc.json
    pilot_n: 1
    n: 1   # per boot (2 boots): 16 runs per boot, each recording replayed once

  # connection reuse: byte attribution with a shared keep-alive pool, with and without send binding
  E5reuse:
    spec: workflow/experiments/E5reuse.json
    pilot_n: 1
    n: 3   # per boot (2 boots): 100+ requests per run

  # misbehaving tool claiming another identity, with and without the trusted-runtime filter
  E6spoof:
    spec: workflow/experiments/E6spoof.json
    pilot_n: 1
    n: 3   # per boot (2 boots), as E6: K=2 has 50 decisions per run -> 300 >= 299

  # identity derived from the MCP session vs. client-chosen _meta, under a lying client
  E6sess:
    spec: workflow/experiments/E6sess.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 100 decisions per run -> 600 >= 299 per cell

  # failure boundary: native connect bypassing the hooks, with and without clearing
  E5native:
    spec: workflow/experiments/E5native.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 200 connections per run

  # the official MCP fetch server, whole and unmodified, one process for all sessions
  E5fetch:
    spec: workflow/experiments/E5fetch.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=2 has 100 connections per run (page + robots.txt)

  # UDP flows (DNS-format queries; dnspython)
  E5udp:
    spec: workflow/experiments/E5udp.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 100 flows per run

  # live accounting exported over IPFIX and decoded by Wireshark
  E8ipfix:
    spec: workflow/experiments/E8ipfix.json
    pilot_n: 1
    n: 3   # per boot (2 boots)

  # integrated configuration: every option on at once
  E9all:
    spec: workflow/experiments/E9all.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 300 flows and 100 decisions per run

  # egress policy on connections reused across executions (per-send authorization, BPF LSM)
  E6reuse:
    spec: workflow/experiments/E6reuse.json
    pilot_n: 1
    n: 3   # per boot (2 boots): K=4 has 100 operations per run -> 600 per cell

  # integrated configuration with the policy on every send (UDP sendmsg4 + LSM)
  E9b:
    spec: workflow/experiments/E9b.json
    pilot_n: 1
    n: 3   # per boot (2 boots)

# target relative precision (half-width of the 95% CI / mean) for sizing N
precision_target: 0.05
